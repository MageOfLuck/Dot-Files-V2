# Example for Hyprland's traditional .conf syntax. Merge into your config;
# this file does not replace it. If you use Lua configuration, use the same
# commands in your existing binding syntax instead.
exec-once = env QT_QUICK_CONTROLS_STYLE=Fusion qs -p "${XDG_CONFIG_HOME:-$HOME/.config}/quickshell/edge-control"

bind = SUPER, A, exec, qs -p "${XDG_CONFIG_HOME:-$HOME/.config}/quickshell/edge-control" ipc call control toggle audio
bind = SUPER, B, exec, qs -p "${XDG_CONFIG_HOME:-$HOME/.config}/quickshell/edge-control" ipc call control toggle bluetooth
bind = SUPER, N, exec, qs -p "${XDG_CONFIG_HOME:-$HOME/.config}/quickshell/edge-control" ipc call control toggle network
bind = SUPER, C, exec, qs -p "${XDG_CONFIG_HOME:-$HOME/.config}/quickshell/edge-control" ipc call control toggle clock
bind = SUPER SHIFT, N, exec, qs -p "${XDG_CONFIG_HOME:-$HOME/.config}/quickshell/edge-control" ipc call control toggle notifications
bind = SUPER, D, exec, qs -p "${XDG_CONFIG_HOME:-$HOME/.config}/quickshell/edge-control" ipc call control toggle dashboard
bind = SUPER, M, exec, qs -p "${XDG_CONFIG_HOME:-$HOME/.config}/quickshell/edge-control" ipc call control toggle media

# Optional hardware keys. Keep existing volume bindings if you prefer them:
# the OSD observes PipeWire volume/mute changes independently.
# bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
# bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
# bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
# bindl = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# Toggle persistent visible bar + reserved space on all monitors.
bind = SUPER SHIFT, B, exec, qs -p "${XDG_CONFIG_HOME:-$HOME/.config}/quickshell/edge-control" ipc call control toggleReserve
